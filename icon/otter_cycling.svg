<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640" role="img" aria-labelledby="title desc">
 <title id="title">水獭的春日骑行</title>
 <desc id="desc">戴黄色头盔的棕色小水獭，骑着薄荷绿色自行车，车篮里放着一条小鱼。</desc>
 <defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f3f9ef"/><stop offset="1" stop-color="#fff5e5"/></linearGradient>
  <linearGradient id="fur" x2=".8" y2="1"><stop stop-color="#b8845b"/><stop offset="1" stop-color="#916043"/></linearGradient>
  <linearGradient id="helmet" x2="0" y2="1"><stop stop-color="#ffdd7b"/><stop offset="1" stop-color="#efb950"/></linearGradient>
  <g id="wheel" fill="none">
   <circle r="77" fill="#fffaf0" stroke="#485653" stroke-width="12"/>
   <circle r="67" stroke="#d0d9cc" stroke-width="3"/>
   <g stroke="#b2c3b8" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
   </g>
   <circle r="8" fill="#687e71" stroke="#fffaf0" stroke-width="3"/>
  </g>
 </defs>
